name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE Linux dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ninja-build libasound2-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libfreetype-dev libfontconfig1-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-linux

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j 4

      - name: Smoke test (headless render, both genres)
        run: |
          ./build/rtg_cli --out /tmp/riddim.wav --seconds 60 --seed 42
          ./build/rtg_cli --out /tmp/trap.wav --genre trap --bpm 150 --seconds 60 --seed 7

      - name: Determinism check (same seed → identical audio)
        run: |
          ./build/rtg_cli --out /tmp/a.wav --seconds 30 --seed 1234 --library /tmp/libA
          ./build/rtg_cli --out /tmp/b.wav --seconds 30 --seed 1234 --library /tmp/libB
          cmp /tmp/a.wav /tmp/b.wav && echo "deterministic ✔"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-windows

      - name: Configure
        shell: bash
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build --config Release --target rtg_cli -j 4
          cmake --build build --config Release --target RiddimTrapGenerator -j 4

      - name: Smoke test
        shell: bash
        run: ./build/Release/rtg_cli.exe --out smoke.wav --seconds 45 --seed 42
