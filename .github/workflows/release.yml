name: Release

# Manual "run release workflow" pipeline:
#  - computes the next version tag automatically (v1.0.0 for the first
#    release, then bumps patch/minor/major per the input),
#  - builds the Windows exe,
#  - runs the headless smoke test,
#  - creates the tag + GitHub Release with the exe assets.
# The app's in-app update checker polls /releases/latest for these tags.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for this release"
        type: choice
        default: patch
        options: [patch, minor, major]
  push:
    tags: ["v*"]
    branches: ["main", "claude/**"]
    paths: ["VERSION"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        shell: bash
        run: |
          echo "skip=false" >> "$GITHUB_OUTPUT"
          git fetch --tags --quiet
          # 1) Tag push: release exactly that version.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            next="${GITHUB_REF#refs/tags/v}"
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "tag=v$next"    >> "$GITHUB_OUTPUT"
            echo "Releasing pushed tag v$next"
            exit 0
          fi
          # 2) Branch push touching VERSION: release the file's version
          #    (skip if that tag already exists).
          if [[ "${{ github.event_name }}" == "push" ]]; then
            next=$(tr -d ' \n\r' < VERSION); next="${next#v}"
            if git rev-parse -q --verify "refs/tags/v$next" >/dev/null; then
              echo "Tag v$next already exists — nothing to release."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
            echo "version=$next" >> "$GITHUB_OUTPUT"
            echo "tag=v$next"    >> "$GITHUB_OUTPUT"
            echo "Releasing VERSION file v$next"
            exit 0
          fi
          # 3) Manual dispatch: bump from the latest existing tag.
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            next="1.0.0"
          else
            base="${latest#v}"; base="${base%%-*}"
            IFS=. read -r MA MI PA <<< "$base"
            case "${{ inputs.bump }}" in
              major) next="$((MA+1)).0.0" ;;
              minor) next="$MA.$((MI+1)).0" ;;
              *)     next="$MA.$MI.$((PA+1))" ;;
            esac
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "tag=v$next"    >> "$GITHUB_OUTPUT"
          echo "Releasing v$next (previous: ${latest:-none})"

      - name: Cache JUCE
        if: steps.version.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-windows-${{ runner.os }}

      - name: Configure
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          cmake -B build -DRTG_VERSION="${{ steps.version.outputs.version }}" \
                -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          cmake --build build --config Release --target rtg_cli -j 4
          cmake --build build --config Release --target RiddimTrapGenerator -j 4

      - name: Smoke test (headless render)
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          ./build/Release/rtg_cli.exe --out smoke.wav --seconds 45 --seed 42
          ./build/Release/rtg_cli.exe --out smoke_trap.wav --genre trap --seconds 45 --seed 7

      - name: Package
        if: steps.version.outputs.skip != 'true'
        id: package
        shell: bash
        run: |
          exe="build/RiddimTrapGenerator_artefacts/Release/Riddim Trap Generator.exe"
          ls -la "$(dirname "$exe")"
          mkdir -p dist
          cp "$exe" "dist/RiddimTrapGenerator-win64.exe"
          cd dist
          7z a "RiddimTrapGenerator-${{ steps.version.outputs.tag }}-win64.zip" \
             "RiddimTrapGenerator-win64.exe"
          ls -la

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Riddim Trap Generator ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/RiddimTrapGenerator-win64.exe
            dist/RiddimTrapGenerator-${{ steps.version.outputs.tag }}-win64.zip
